version: 2

models:
  - name: stg_weather_observations
    description: "Cleaned hourly weather observations from Silver parquet layer."

    columns:

      - name: city
        description: "City name for the weather observation."
        tests:
          - not_null
          - accepted_values:
              values:
                - Mumbai
                - Delhi
                - Bengaluru
                - Hyderabad
                - Chennai
                - Kolkata
                - Guwahati

      - name: observed_date
        description: "Observation date extracted from timestamp."
        tests:
          - not_null

      - name: observed_at
        description: "Full timestamp of weather observation."
        tests:
          - not_null

      - name: temperature_c
        description: "Temperature in Celsius."
        tests:
          - not_null

      - name: relative_humidity_pct
        description: "Relative humidity percentage."
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
              max_value: 100

      - name: precipitation_mm
        description: "Hourly precipitation in millimeters."
        tests:
          - not_null

      - name: wind_speed_kmh
        description: "Wind speed in kilometers per hour."
        tests:
          - not_null

      - name: weather_description
        description: "Semantic weather condition derived from WMO weather code."
        tests:
          - accepted_values:
              values:
                - clear
                - cloudy
                - fog
                - rain
                - rain_showers
                - thunderstorm
                - unknown

  - name: int_weather_daily_summary
    description: "Daily aggregated city-level weather summary."

    columns:

      - name: city
        tests:
          - not_null

      - name: observed_date
        tests:
          - not_null

      - name: hourly_records_count
        description: "Expected hourly observation count for a complete day."
        tests:
          - not_null

      - name: is_complete_day
        description: "Indicates whether all 24 hourly observations are present."
        tests:
          - not_null

  - name: mart_weather_dashboard
    description: "Business-facing dashboard mart containing daily weather KPIs."

    columns:

      - name: city
        tests:
          - not_null

      - name: observed_date
        tests:
          - not_null

      - name: hottest_city_rank_for_day
        tests:
          - not_null

      - name: wettest_city_rank_for_day
        tests:
          - not_null

  - name: mart_weather_alerts
    description: "Weather alerts mart for identifying extreme weather conditions."

    columns:

      - name: city
        tests:
          - not_null

      - name: observed_date
        tests:
          - not_null

      - name: alert_type
        tests:
          - not_null
          - accepted_values:
              values:
                - HEAT_WAVE
                - HEAVY_RAIN
                - STRONG_WIND
                - HIGH_HUMIDITY

      - name: alert_severity
        tests:
          - not_null
          - accepted_values:
              values:
                - LOW
                - MEDIUM
                - HIGH