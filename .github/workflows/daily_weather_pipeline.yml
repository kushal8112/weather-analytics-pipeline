name: Daily Weather Pipeline

on:
  schedule:
    - cron: "30 00 * * *"   # 6:00 PM IST
  workflow_dispatch:

jobs:
  daily-weather-run:
    runs-on: ubuntu-latest

    env:
      AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run weather ingestion
        run: |
          python ingestion/fetch_weather.py

      - name: Check generated parquet files
        run: |
          find cache -type f || true

      - name: Install dbt packages
        working-directory: dbt_project
        run: |
          dbt deps --profiles-dir .

      - name: Run dbt models
        working-directory: dbt_project
        run: |
          dbt run --profiles-dir .

      - name: Run dbt tests
        working-directory: dbt_project
        run: |
          dbt test --profiles-dir .

      - name: Send success email
        if: success()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.GMAIL_USERNAME }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: Weather Pipeline Success
          to: ${{ secrets.NOTIFICATION_EMAIL }}
          from: Weather Pipeline <${{ secrets.GMAIL_USERNAME }}>
          body: |
            Daily weather pipeline completed successfully.
            Ingestion, dbt run, and dbt tests all passed.

      - name: Send failure email
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.GMAIL_USERNAME }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: Weather Pipeline Failed
          to: ${{ secrets.NOTIFICATION_EMAIL }}
          from: Weather Pipeline <${{ secrets.GMAIL_USERNAME }}>
          body: |
            Daily weather pipeline failed.
            Check the GitHub Actions logs for details:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}